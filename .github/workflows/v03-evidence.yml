name: v03 offline evidence reproduction
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/quasar2/v03/**'
      - 'experiments/v03/**'
      - 'docs/V03_PREREGISTRATION.md'
      - '.github/workflows/v03-evidence.yml'
permissions:
  contents: read
jobs:
  reproduce-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: quasar2 v03 audit
      - run: quasar2 reproduce-v03 --input experiments/v03/datasets/control.json.gz --output /tmp/v03-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: v03-diagnostic-control
          path: /tmp/v03-evidence
