    "max_explore_rounds": 2,
    "wrong_answer_cost": 1.4,
    "exploration_cost": 0.10,
    "ask_cost": 0.28,
    "allow_ask": true
  },
  "benchmark": {
    "cutoff": 10,
    "bootstrap_samples": 1000
  },
  "experiment": {
    "cutoff": 10,
    "bootstrap_samples": 1000,
    "seeds": [42, 43, 44],
    "methods": [
      "bm25",
      "dense_hash",
      "hybrid",
      "rewrite_hybrid",
      "multi_query",
      "full+bm25",
      "full+dense_hash",
      "full+hybrid"
    ]
  }
}
