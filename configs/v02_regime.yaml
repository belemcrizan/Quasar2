{
  "seed": 42,
  "mode": "catalog",
  "role": "scientific_regime_experiment",
  "paths": {
    "domains": "configs/domains_ops.yaml",
    "intents": "data/ops/intents.json",
    "corpus": "data/ops/corpus",
    "catalog": "data/ops/hypotheses_catalog"
  },
  "hypotheses": {
    "max_candidates": 4,
    "minimum_generation_score": 0.02
  },
  "retrieval": {
    "backend": "hybrid",
    "initial_top_k_per_hypothesis": 1,
    "top_k_per_hypothesis": 4,
    "bm25_weight": 0.60,
    "dense_weight": 0.40,
    "rrf_k": 20,
    "dense_dimensions": 384,
    "neural_model": "sentence-transformers/all-MiniLM-L6-v2",
    "neural_device": "cpu"
  },
  "evidence": {
    "retrieval_weight": 0.25,
    "observation_weight": 0.40,
    "anchor_weight": 0.20,
    "discriminator_weight": 0.15,
    "foreign_hypothesis_penalty": 0.20
  },
  "belief": {
    "evidence_strength": 4.0,
    "temperature": 1.0,
    "probability_floor": 0.000001
