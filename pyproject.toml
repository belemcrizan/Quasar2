[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quasar2"
version = "0.2.0"
description = "A falsifiable POC for latent-intent recovery with competing hypotheses and discriminative exploration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Crizan Belém Ribeiro"}]
keywords = ["information-retrieval", "latent-intent", "hypothesis-testing", "agentic-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
neural = ["sentence-transformers>=3.0", "numpy>=1.24", "torch>=2.6"]
dense = ["sentence-transformers>=3.0", "numpy>=1.24", "torch>=2.6"]
graph = []
benchmark = ["pytest>=8.0"]
all = ["sentence-transformers>=3.0", "numpy>=1.24", "torch>=2.6", "pytest>=8.0"]

[project.scripts]
quasar2 = "quasar2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
