services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./experiments/results:/app/experiments/results:ro
      - ./configs:/app/configs:ro
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
